<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | JRSphere</title>
    <meta
      name="description"
      content="The requested page could not be found on the JRSphere website."
    >
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f7f9fc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#081120" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/website/assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/website/assets/css/reset.css">
    <link rel="stylesheet" href="/website/assets/css/tokens.css">
    <link rel="stylesheet" href="/website/assets/css/main.css">
  </head>
  <body class="error-layout">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="wordmark" href="/website/" aria-label="JRSphere home">JRSphere</a>
      </div>
    </header>

    <main class="error-page section" id="main-content">
      <div class="container error-panel stack stack--large">
        <p class="error-code" aria-hidden="true">404</p>
        <div class="stack">
          <p class="eyebrow">Page not found</p>
          <h1>We could not find that page</h1>
          <p class="error-summary">
            The address may be incorrect, or the page may have moved. Return to
            the JRSphere home page or contact us if you need assistance.
          </p>
        </div>
        <div class="cluster">
          <a class="button button--primary" href="/website/">Return home</a>
          <a class="button button--secondary" href="mailto:jrsphere.jrs@gmail.com">
            Email JRSphere
          </a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container cluster site-footer__inner">
        <p>© 2026 JRSphere.</p>
        <a href="/website/">Home</a>
      </div>
    </footer>
  </body>
</html>
