name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package public files
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate static site
        run: python3 scripts/validate-site.py

      - name: Enforce release indexing gate
        run: |
          if grep -Fq '<meta name="robots" content="noindex, nofollow">' index.html; then
            echo '::error file=index.html::Remove the homepage noindex directive only after final release approval.'
            exit 1
          fi

      - name: Package allowlisted public files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp -- .nojekyll 404.html index.html sitemap.xml _site/
          cp -R -- assets _site/assets

          find _site -type f -printf '%P\n' | sort > "$RUNNER_TEMP/actual-public-files.txt"
          {
            printf '%s\n' .nojekyll 404.html index.html sitemap.xml
            find assets -type f -print | sort
          } | sort > "$RUNNER_TEMP/expected-public-files.txt"

          diff -u "$RUNNER_TEMP/expected-public-files.txt" "$RUNNER_TEMP/actual-public-files.txt"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy approved artifact
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
