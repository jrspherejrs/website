name: Validate static site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Package-free source checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate static site
        run: python3 scripts/validate-site.py

      - name: Validate navigation JavaScript
        run: node --check assets/js/navigation.js
